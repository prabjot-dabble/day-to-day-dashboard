<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dabble · Revenue Command · Sep 2026</title>
<style>
:root{
  /* pigment-derived palette: ultramarine, raw sienna, cadmium, viridian */
  --ink:#16233A; --ink-2:#22334F; --ink-soft:#5A6B85;
  --paper:#F4F6F9; --card:#FFFFFF; --line:#E1E6EE; --line-soft:#EDF0F5;
  --text:#1B2436; --text-2:#5D6A80; --text-3:#8B97AA;
  --ultra:#2B57D0; --ultra-soft:#E7EDFB;
  --pos:#0E7A63; --pos-soft:#E3F3EE;
  --warn:#B5730F; --warn-soft:#FBF0DC;
  --neg:#BE3A34; --neg-soft:#FBE9E7;
  --mute:#8B97AA; --mute-soft:#EEF1F6;
  --c-web:#2B57D0; --c-amz:#C88318; --c-blk:#A63A72; --c-fc:#12796F; --c-ms:#6A51B5; --c-bik:#4B6A9B;
  --r:10px; --shadow:0 1px 2px rgba(22,35,58,.05);
  --sans:"Inter","Inter var",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); background:var(--paper); color:var(--text);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1,"cv05" 1;
}
h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-.011em}
a{color:var(--ultra)}
button{font-family:inherit; font-size:inherit; cursor:pointer}
::selection{background:var(--ultra-soft)}
:focus-visible{outline:2px solid var(--ultra); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- frame ---------- */
.app{display:grid; grid-template-columns:216px 1fr; min-height:100vh}
.rail{
  background:var(--ink); color:#fff; position:sticky; top:0; height:100vh;
  display:flex; flex-direction:column; overflow-y:auto;
}
.brand{padding:20px 18px 16px; border-bottom:1px solid rgba(255,255,255,.09)}
.brand .mark{display:flex; align-items:center; gap:9px}
.brand .dot{width:11px;height:11px;border-radius:50%;background:#E9B949; box-shadow:9px 0 0 -1px #4DA0C9, 18px 0 0 -2px #D2624F}
.brand h1{font-size:15px; color:#fff; margin-left:20px}
.brand p{margin:9px 0 0; font-size:11.5px; color:rgba(255,255,255,.55); line-height:1.4}
.nav{padding:10px 8px; flex:1}
.nav button{
  display:flex; align-items:baseline; gap:9px; width:100%; text-align:left;
  background:none; border:0; color:rgba(255,255,255,.72); padding:8px 10px;
  border-radius:7px; font-size:13px; line-height:1.3; margin-bottom:1px;
}
.nav button .n{font-size:10.5px; color:rgba(255,255,255,.35); width:12px; flex:none}
.nav button:hover{background:rgba(255,255,255,.07); color:#fff}
.nav button.on{background:rgba(255,255,255,.13); color:#fff; font-weight:550}
.nav button.on .n{color:#E9B949}
.rail-foot{padding:12px 18px 16px; font-size:11px; color:rgba(255,255,255,.45); border-top:1px solid rgba(255,255,255,.09)}
.rail-foot b{color:rgba(255,255,255,.8); font-weight:550}

.main{min-width:0; display:flex; flex-direction:column}

/* ---------- control bar ---------- */
.ctrl{
  position:sticky; top:0; z-index:40; background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:10px 22px;
  display:flex; gap:14px; align-items:center; flex-wrap:wrap;
}
.ctrl .grp{display:flex; align-items:center; gap:6px}
.ctrl label{font-size:11.5px; color:var(--text-3)}
.presets{display:flex; gap:3px; background:var(--mute-soft); padding:3px; border-radius:8px; flex-wrap:wrap}
.presets button{
  border:0; background:none; padding:5px 9px; border-radius:6px; font-size:12px;
  color:var(--text-2); white-space:nowrap;
}
.presets button:hover{color:var(--text)}
.presets button.on{background:#fff; color:var(--ink); font-weight:550; box-shadow:var(--shadow)}
input[type=date],select{
  font-family:inherit; font-size:12.5px; padding:5px 7px; border:1px solid var(--line);
  border-radius:7px; background:#fff; color:var(--text); font-variant-numeric:tabular-nums;
}
.range-sep{color:var(--text-3); font-size:12px}
.ctrl .spacer{flex:1}
.pill{
  font-size:11.5px; padding:4px 9px; border-radius:20px; background:var(--mute-soft);
  color:var(--text-2); white-space:nowrap;
}
.pill.live{background:var(--ultra-soft); color:var(--ultra)}

.basis{
  padding:7px 22px; font-size:12px; background:var(--warn-soft); color:#6E4708;
  border-bottom:1px solid #F0E2C6; display:flex; gap:8px; align-items:baseline;
}
.basis b{font-weight:600}
.basis.neutral{background:var(--mute-soft); color:var(--text-2); border-bottom-color:var(--line)}
.sec-hd .hint{display:flex; align-items:center; gap:8px; flex-wrap:wrap}

/* ---------- layout ---------- */
.view{padding:22px 22px 60px; display:none; max-width:1560px}
.view.on{display:block}
.sec{margin-bottom:26px}
.sec-hd{display:flex; align-items:baseline; gap:10px; margin-bottom:11px; flex-wrap:wrap}
.sec-hd h2{font-size:15.5px}
.sec-hd h3{font-size:13.5px}
.sec-hd .hint{font-size:12px; color:var(--text-3)}
.grid{display:grid; gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}
.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px}
.card.pad0{padding:0; overflow:hidden}
.card h3{font-size:13.5px; margin-bottom:2px}
.card .sub{font-size:11.5px; color:var(--text-3); margin-bottom:10px}

/* ---------- hero ---------- */
.hero{
  background:linear-gradient(180deg,#fff, #FCFDFE); border:1px solid var(--line);
  border-radius:12px; padding:18px 20px; margin-bottom:14px;
}
.hero-top{display:flex; justify-content:space-between; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:14px}
.hero-top .who{font-size:12.5px; color:var(--text-2)}
.hero-top .who b{color:var(--text); font-weight:600}
.hero-body{display:grid; grid-template-columns:minmax(210px,auto) minmax(0,1fr) auto; gap:26px; align-items:center}
.hero-num{font-size:42px; font-weight:600; letter-spacing:-.03em; line-height:1}
.hero-lbl{font-size:12px; color:var(--text-3); margin-top:5px}
.hero-delta{font-size:12.5px; margin-top:7px}
.bar-wrap{position:relative; padding-top:16px}
.bar-track{height:22px; background:var(--mute-soft); border-radius:5px; position:relative; overflow:hidden}
.bar-fill{height:100%; border-radius:5px 0 0 5px}
.bar-notch{position:absolute; top:-6px; bottom:-6px; width:2px; background:var(--ink); border-radius:2px}
.bar-notch span{
  position:absolute; top:-15px; left:50%; transform:translateX(-50%); font-size:10.5px;
  color:var(--ink); white-space:nowrap; font-weight:600;
}
.bar-legend{display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-3); margin-top:7px}
.hero-ach{text-align:right}
.hero-ach .v{font-size:30px; font-weight:600; letter-spacing:-.02em; line-height:1}
.hero-ach .l{font-size:11.5px; color:var(--text-3); margin-top:5px}

/* ---------- kpi ---------- */
.kpi{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:12px 13px; min-width:0}
.kpi .k{font-size:11.5px; color:var(--text-3); display:flex; align-items:center; gap:5px; margin-bottom:6px}
.kpi .v{font-size:21px; font-weight:600; letter-spacing:-.02em; line-height:1.15; word-break:break-word}
.kpi .v.sm{font-size:18px}
.kpi .d{font-size:11.5px; color:var(--text-2); margin-top:6px; line-height:1.35}
.kpi.accent{border-left:3px solid var(--ultra)}
.up{color:var(--pos)} .down{color:var(--neg)} .flat{color:var(--text-3)} .amber{color:var(--warn)}
.na{color:var(--text-3); font-style:normal}
.chip{
  display:inline-block; font-size:10.5px; padding:1px 6px; border-radius:5px;
  background:var(--mute-soft); color:var(--text-2); vertical-align:middle;
}
.chip.g{background:var(--pos-soft); color:var(--pos)}
.chip.a{background:var(--warn-soft); color:var(--warn)}
.chip.r{background:var(--neg-soft); color:var(--neg)}
.chip.b{background:var(--ultra-soft); color:var(--ultra)}
.dotc{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}

/* ---------- charts ---------- */
.chart{position:relative; width:100%}
.chart canvas{display:block; width:100%!important}
.h180{height:180px}.h200{height:200px}.h220{height:220px}.h240{height:240px}.h260{height:260px}.h300{height:300px}.h320{height:320px}

/* ---------- tables ---------- */
.tw{overflow-x:auto; border-radius:var(--r)}
table{border-collapse:collapse; width:100%; font-size:12.5px}
th{
  text-align:right; font-weight:550; color:var(--text-3); font-size:11.5px; padding:8px 9px;
  border-bottom:1px solid var(--line); white-space:nowrap; background:#fff; position:sticky; top:0;
}
th:first-child,td:first-child{text-align:left}
th.l,td.l{text-align:left}
td{padding:7px 9px; border-bottom:1px solid var(--line-soft); text-align:right; white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FAFBFD}
tfoot td{font-weight:600; border-top:1px solid var(--line); background:#FAFBFD}
td.pos{color:var(--pos)} td.neg{color:var(--neg)} td.wrn{color:var(--warn)}
.cellbg-g{background:var(--pos-soft)} .cellbg-a{background:var(--warn-soft)} .cellbg-r{background:var(--neg-soft)}
table.sortable th{cursor:pointer; user-select:none}
table.sortable th:hover{color:var(--text)}

/* ---------- funnel ---------- */
.funnel{display:flex; flex-direction:column; gap:2px}
.fstep{display:grid; grid-template-columns:98px minmax(0,1fr) 120px; gap:12px; align-items:center}
.fstep .fl{font-size:12px; color:var(--text-2)}
.fbar{height:34px; border-radius:5px; display:flex; align-items:center; padding:0 10px; color:#fff; font-weight:600; font-size:13px; min-width:64px}
.fstep .fr{font-size:11.5px; color:var(--text-3); text-align:right}
.fdrop{font-size:11px; color:var(--text-3); padding:1px 0 1px 110px}

/* ---------- insights ---------- */
.ins{border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:#fff}
.ins-hd{padding:9px 14px; font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line)}
.ins-hd.g{background:var(--pos-soft); color:var(--pos)}
.ins-hd.a{background:var(--warn-soft); color:var(--warn)}
.ins-hd.r{background:var(--neg-soft); color:var(--neg)}
.ins-hd.b{background:var(--ultra-soft); color:var(--ultra)}
.ins ul{margin:0; padding:10px 14px 12px 28px}
.ins li{margin-bottom:7px; font-size:12.8px; line-height:1.5}
.ins li:last-child{margin-bottom:0}
.ins li b{font-weight:600}
.oia{border:1px solid var(--line); border-radius:var(--r); padding:13px 15px; background:#fff}
.oia .t{font-size:13px; font-weight:600; margin-bottom:8px}
.oia dl{margin:0; display:grid; grid-template-columns:78px minmax(0,1fr); gap:5px 10px; font-size:12.6px; line-height:1.5}
.oia dt{color:var(--text-3); font-size:11.5px; padding-top:1px}
.oia dd{margin:0}
.summ{display:grid; grid-template-columns:150px minmax(0,1fr); gap:8px 14px; font-size:13px; line-height:1.5}
.summ dt{color:var(--text-3); font-size:11.5px; padding-top:2px}
.summ dd{margin:0}

/* ---------- misc ---------- */
.note{
  font-size:12px; color:var(--text-2); background:var(--mute-soft); border-radius:8px;
  padding:9px 12px; line-height:1.5;
}
.note.b{background:var(--ultra-soft); color:#2A4795}
.note.a{background:var(--warn-soft); color:#6E4708}
.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:11.5px; color:var(--text-2); align-items:center}
.legend span{display:flex; align-items:center; gap:5px}
.toggles{display:flex; gap:4px; flex-wrap:wrap}
.toggles button{
  border:1px solid var(--line); background:#fff; padding:3px 9px; border-radius:20px;
  font-size:11.5px; color:var(--text-2);
}
.toggles button.on{background:var(--ink); border-color:var(--ink); color:#fff}
.empty{padding:22px; text-align:center; color:var(--text-3); font-size:12.5px}
.recon-row{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; padding:10px 0; border-bottom:1px solid var(--line-soft)}
.recon-row:last-child{border-bottom:0}
.recon-row .n{font-size:12.5px; font-weight:550}
.recon-row .x{font-size:11.5px; color:var(--text-2); margin-top:3px; line-height:1.45}
.recon-row .r{text-align:right; font-size:11.5px; white-space:nowrap}
.drill{border:1px solid var(--line); border-radius:var(--r); background:#fff; padding:14px 16px}
.clickable{cursor:pointer}
tr.clickable:hover td:first-child{color:var(--ultra)}

@media (max-width:1180px){
  .g6,.g5{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:minmax(0,1fr)}
  .hero-body{grid-template-columns:minmax(0,1fr)}
  .hero-ach{text-align:left}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:static; height:auto; flex-direction:column}
  .nav{display:grid; grid-template-columns:repeat(3,1fr); gap:2px}
  .rail-foot{display:none}
  .g3,.g2,.g5,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .view{padding:16px 14px 50px}
  .hero-num{font-size:34px}
}
@media (max-width:600px){
  .g3,.g2,.g4,.g5,.g6{grid-template-columns:minmax(0,1fr)}
  .nav{grid-template-columns:repeat(2,1fr)}
  .fstep{grid-template-columns:74px minmax(0,1fr); }
  .fstep .fr{grid-column:2; text-align:left}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="mark"><span class="dot"></span><h1>Dabble Revenue Command</h1></div>
      <p id="brandSub">Loading workbook…</p>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      Source <b>Overall_Channel_Performance-Sep.xlsx</b><br>6 sheets · figures as recorded
    </div>
  </aside>

  <div class="main">
    <div class="ctrl">
      <div class="grp">
        <div class="presets" id="presets"></div>
      </div>
      <div class="grp">
        <input type="date" id="dStart"><span class="range-sep">to</span><input type="date" id="dEnd">
      </div>
      <div class="grp">
        <label for="chanSel">Channel</label>
        <select id="chanSel"></select>
      </div>
      <div class="grp">
        <label for="cmpSel">Compare</label>
        <select id="cmpSel">
          <option value="auto">Automatic</option>
          <option value="prev">Previous period only</option>
          <option value="split">Within range (2nd half vs 1st)</option>
          <option value="none">No comparison</option>
        </select>
      </div>
      <div class="spacer"></div>
      <span class="pill" id="rangePill"></span>
    </div>
    <div class="basis" id="basis"></div>
    <div id="views"></div>
  </div>
</div>

<script>/* ============================================================================
   Dabble Revenue Command — analytical layer
   Every figure below is computed from DATA, which is a direct parse of
   Overall_Channel_Performance-Sep.xlsx. Nothing is hard-coded.

   Formula reference (all guarded against null / zero denominators):
     achievement        = actual / target
     variance           = actual - target
     growth             = (current - previous) / previous
     channelContribution= channelGMV / totalGMV
     atcRate            = atc / traffic
     conversionRate     = orders / traffic
     atcToOrderRate     = orders / atc
     aov                = gmv / orders
     revenuePerVisitor  = gmv / traffic
     cpu                = marketingSpend / orders
     spendPerGMV        = spend / gmv
     roas               = attributedSales / spend
     blendedRoas        = totalGMV / totalRecordedSpend
   ========================================================================== */

const CFG = {
  ach:      { weak: 0.90, watch: 1.00 },          // target achievement bands
  convBps:  { watch: 30,  weak: 60 },             // conversion drop, basis points
  aovPct:   { watch: 0.05, weak: 0.12 },          // AOV decline
  roasPct:  { watch: 0.15, weak: 0.30 },          // ROAS deterioration
  spendGap: 0.10,          // spend growth exceeding GMV growth by this = flag
  volatility: 0.15,        // day-over-day GMV swing
  concentration: 0.55,     // single-channel share of GMV
  roasFloor: 2.0           // reference blended ROAS for quadrant classification
};

const NA = '<span class="na">Not updated</span>';
const NC = '<span class="na">No comparison</span>';

/* ---------- number & date formatting ---------- */
const trim = s => s.replace(/\.?0+$/, '');
function money(v, opt) {
  if (v == null || !isFinite(v)) return NA;

const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    ? A.getUTCDate() + '–' + B.getUTCDate() + ' ' + MON[B.getUTCMonth()] + ' ' + B.getUTCFullYear()

/* ---------- delta rendering ---------- */
/* invert = true  → a fall is the good direction (cost, ratios)

  const g = growth(cur, prev);

  const cls = invert === 'n' ? 'flat' : flat ? 'flat' : ((invert ? g < 0 : g > 0) ? 'up' : 'down');
  const arrow = flat ? '' : (g > 0 ? '▲ ' : '▼ ');

/* ---------- aggregation (missing values are preserved, never zeroed) ---------- */
function sumOf(rows, k) {
  let t = 0, n = 0, m = 0;
  for (const r of rows) { const v = r[k]; if (v == null) m++; else { t += v; n++; } }
  return { v: n ? t : null, n, m };
}
function agg(rows) {
  const A = { rows, days: rows.length, from: rows[0] && rows[0].date, to: rows.length ? rows[rows.length - 1].date : null, miss: {} };
  const S = k => { const o = sumOf(rows, k); A.miss[k] = o.m; return o.v; };
  A.sum = S;

  // Sum of each channel's OWN independently-summed total — never null-blocked by a
  // different channel's gap on the same day (unlike the per-day pre-combined totalGMV
  // field, which the source only populates when ALL five channels reported that day).
  const channelGmvSum = rws => {
    let t = 0, any = false;
    CHANNELS.forEach(c => { const o = sumOf(rws, c.gmv); if (o.v != null) { t += o.v; any = true; } });
    return any ? t : null;
  };

  /* revenue */
  A.gmv        = channelGmvSum(rows);     // Website + Amazon Total + Blinkit + FirstCry + Moms Store
  A.gmvSheet   = S('totalGMVReported');   // the workbook's own Total GMV column, kept for reconciliation
  A.target     = S('d3pTarget');
  A.dabbleGmv  = S('dabbleActual');
  A.dabbleTgt  = S('dabbleTarget');
  A.dabbleAch  = div(A.dabbleGmv, A.dabbleTgt);
  A.dabbleVar  = (A.dabbleGmv == null || A.dabbleTgt == null) ? null : A.dabbleGmv - A.dabbleTgt;

  // Amazon's own plan/actual, from the target sheet's 'Az GMV Plan'/'Az GMV Act' columns.
  // These are absent in any export before this one, so every value here is null (never
  // fabricated) until the source actually supplies them — the UI shows "not tracked" then.
  A.amzTgtPlan = S('amzTgtPlan');
  A.amzTgtAct  = S('amzTgtAct');
  A.amzTgtAch  = div(A.amzTgtAct, A.amzTgtPlan);
  A.amzTgtVar  = (A.amzTgtAct == null || A.amzTgtPlan == null) ? null : A.amzTgtAct - A.amzTgtPlan;
  A.amzSpendTgtPlan = S('amzTgtSpendPlan');
  A.amzSpendTgtAct  = S('amzTgtSpendAct');

  // Achievement/variance against the Dabble+3P plan must be scoped to only the days a
  // plan actually exists for — otherwise a fuller-coverage actual (A.gmv, above) gets
  // compared against a partial-coverage target and overstates or understates achievement.
  const targetRows = rows.filter(r => r.d3pTarget != null);
  A.targetDays = targetRows.length;
  A.gmvForPlan = channelGmvSum(targetRows);
  A.ach        = div(A.gmvForPlan, A.target);
  A.variance   = (A.gmvForPlan == null || A.target == null) ? null : A.gmvForPlan - A.target;

  /* channels */
  A.ch = {};
  CHANNELS.forEach(c => {
    A.ch[c.id] = { gmv: S(c.gmv), spend: c.spend ? S(c.spend) : null, missSpend: c.spend ? A.miss[c.spend] : null };
    A.ch[c.id].share = div(A.ch[c.id].gmv, A.gmv);
  });
  A.websitePaid = S('websitePaid'); A.websiteOrganic = S('websiteOrganic');
  A.bikGmv = S('bikGMV'); A.bikSpend = S('bikSpend');
  A.amazonGmv = S('amazonGMV'); A.amazonB2B = S('amazonB2B');
  A.other3p = (A.ch.firstcry.gmv || 0) + (A.ch.moms.gmv || 0);

  /* spend */
  A.metaSpend = S('metaSpend'); A.googleSpend = S('googleSpend');
  A.websiteSpend = S('websiteSpend'); A.websiteSpendSheet = S('websiteAdsSpendReported');
  A.amazonSpend = S('amazonSpend'); A.blinkitSpend = S('blinkitSpend');
  A.spend = (A.websiteSpend || 0) + (A.amazonSpend || 0) + (A.blinkitSpend || 0);
  A.spendMissingDays = rows.filter(r => !r.spendComplete).length;
  A.spendGmvRatio = div(A.spend, A.gmv);
  A.blendedRoas = div(A.gmv, A.spend);

  /* reported-ROAS roll-ups: rebuild attributed sales as roas x spend, then divide */
  const attr = (roasK, spendK) => {
    let s = 0, sp = 0, m = 0;
    for (const r of rows) {
      if (r[roasK] == null || r[spendK] == null) { m++; continue; }
      s += r[roasK] * r[spendK]; sp += r[spendK];
    }
    return { roas: sp ? s / sp : null, sales: sp ? s : null, spend: sp || null, miss: m };
  };

  A.bikRoas    = div(A.bikGmv, A.bikSpend);                 // = BIK GMV / BIK spend (matches source)
  A.googleRoas = div(null, A.googleSpend);
  A.webBlendRoas = div(A.ch.website.gmv, A.websiteSpend);
  A.amazonRoasRep = attr('amazonROAS', 'amazonSpend');      // ad-attributed, as reported
  A.amazonRoasGmv = div(A.ch.amazon.gmv, A.amazonSpend);    // total Amazon GMV per ₹ of ad spend
  A.blinkitAdSales = S('blkAdSales'); A.blinkitOrganic = S('blkOrganicSales');
  A.blinkitRoas = div(A.blinkitAdSales, A.blinkitSpend);
  A.blinkitRoasMissing = A.miss['blinkitSpend'];

  /* website funnel */
  A.traffic = S('traffic'); A.atc = S('atc'); A.orders = S('orders');
  A.webGmv = A.ch.website.gmv; A.netRev = S('netRevenue'); A.markSpend = S('markSpend');
  A.conv = div(A.orders, A.traffic);
  A.atcRate = div(A.atc, A.traffic);
  A.atcToOrder = div(A.orders, A.atc);
  A.aov = div(A.webGmv, A.orders);
  A.rpv = div(A.webGmv, A.traffic);
  A.cpu = div(A.markSpend, A.orders);
  A.netRevRate = div(A.netRev, A.webGmv);
  A.spendPerNetRev = div(A.markSpend, A.netRev);
  A.markPct = div(A.markSpend, A.webGmv);

  /* returning vs new */
  A.rbOrders = S('rbOrders'); A.nbOrders = S('nbOrders');
  A.rbTraffic = S('rbTraffic'); A.nbTraffic = S('nbTraffic');
  A.rbSpend = S('rbSpend'); A.nbSpend = S('nbSpend');
  A.rbConv = div(A.rbOrders, A.rbTraffic); A.nbConv = div(A.nbOrders, A.nbTraffic);
  A.rbCpu = div(A.rbSpend, A.rbOrders); A.nbCpu = div(A.nbSpend, A.nbOrders);
  const ordTot = (A.rbOrders == null || A.nbOrders == null) ? null : A.rbOrders + A.nbOrders;
  A.returningRate = div(A.rbOrders, ordTot);

  /* order-line truth (Website Sales Report) for AOV / mix by customer type */
  const L = DATA.lines.filter(l => l[0] >= A.from && l[0] <= A.to);
  const byOrder = new Map();
  L.forEach(l => {
    if (!byOrder.has(l[1])) byOrder.set(l[1], { type: l[2], sales: 0, net: 0, gm: 0, cancelled: l[10] });
    const o = byOrder.get(l[1]); o.sales += l[6]; o.net += l[7]; o.gm += (l[8] || 0);
  });
  const cust = { 'Returning Customer': { o: 0, s: 0 }, 'First Time Customer': { o: 0, s: 0 } };
  byOrder.forEach(o => { if (cust[o.type]) { cust[o.type].o++; cust[o.type].s += o.sales; } });
  A.lineRB = cust['Returning Customer']; A.lineNB = cust['First Time Customer'];
  A.rbAovLine = div(A.lineRB.s, A.lineRB.o); A.nbAovLine = div(A.lineNB.s, A.lineNB.o);
  A.grossMargin = L.reduce((t, l) => t + (l[8] || 0), 0);
  A.gmRate = div(A.grossMargin, A.netRev);
  A.discount = -L.reduce((t, l) => t + (l[9] || 0), 0);
  A.units = L.reduce((t, l) => t + (l[5] || 0), 0);
  A.cancelledOrders = [...byOrder.values()].filter(o => o.cancelled).length;
  A.lines = L;

  /* Amazon marketplace report */
  const AZ = DATA.amazon.filter(a => a[0] >= A.from && a[0] <= A.to);
  A.amz = {
    rows: AZ,
    sessions: AZ.reduce((t, a) => t + a[4], 0),
    pageViews: AZ.reduce((t, a) => t + a[5], 0),
    units: AZ.reduce((t, a) => t + a[6], 0),
    unitsB2B: AZ.reduce((t, a) => t + a[7], 0),
    sales: AZ.reduce((t, a) => t + a[8], 0),
    salesB2B: AZ.reduce((t, a) => t + a[9], 0),
    items: AZ.reduce((t, a) => t + a[10], 0),
    zeroSessionDays: rows.filter(r => r.amzSessions === 0).map(r => r.date)
  };
  A.amz.unitSession = A.amz.sessions ? A.amz.units / A.amz.sessions : null;
  A.amz.aov = div(A.ch.amazon.gmv, A.amz.items || null);

  /* Blinkit report */
  A.blk = { units: S('blkUnits'), sales: S('blkSales') };
  A.blk.aov = div(A.blk.sales, A.blk.units);
  return A;
}

/* ---------- comparison engine ---------- */
function comparison(start, end, mode) {
  const cur = rowsBetween(start, end);
  const n = cur.length;
  if (mode === 'none' || n === 0) return { rows: [], kind: 'none', label: 'Comparison switched off' };

  const pEnd = addDays(start, -1), pStart = addDays(start, -n);
  const prev = rowsBetween(pStart, pEnd);

  if (mode !== 'split' && prev.length === n)
    return { rows: prev, kind: 'prev', label: 'vs ' + rangeLabel(pStart, pEnd), full: true,
             note: 'Previous comparable period of equal length (' + n + ' days).' };

  if (mode === 'prev') {
    if (!prev.length) return { rows: [], kind: 'none',
      label: 'No prior period in workbook',
      note: 'The workbook starts on ' + short(MIN_D) + ', so there is no data before the selected range.' };
    return { rows: prev, kind: 'prev-partial',
      label: 'vs ' + rangeLabel(prev[0].date, prev[prev.length - 1].date),
      note: 'Unequal periods: ' + prev.length + ' days of prior data against ' + n + ' selected days. Totals are not like-for-like.' };
  }

  /* Automatic mode never compares unequal periods. If the full prior window is missing it
     splits the selected range instead, and says so. */
  if (n >= 2) {
    const h = Math.floor(n / 2), b = cur.slice(n - h), a = cur.slice(n - 2 * h, n - h);
    return { rows: a, curRows: b, kind: 'split',
      label: rangeLabel(b[0].date, b[h - 1].date) + ' vs ' + rangeLabel(a[0].date, a[h - 1].date),
      note: 'No prior period exists in the workbook, so the selected range is split: its last ' + h +
            ' days are compared with the ' + h + ' days before them. This is a within-range trend signal, not a period-on-period comparison.' };
  }
  return { rows: [], kind: 'none', label: 'No comparison available',
           note: 'A single day cannot be compared without prior data in the workbook.' };
}

/* ---------- current view model ---------- */
let V = {};
function build() {
  const cur = rowsBetween(state.start, state.end);
  const cmp = comparison(state.start, state.end, state.cmp);
  V = {
    rows: cur,
    A: agg(cur),
    cmp,
    /* when the fallback split is in force, the "current" side of every delta is the back half */
    C: agg(cmp.kind === 'split' ? cmp.curRows : cur),
    P: cmp.rows.length ? agg(cmp.rows) : null
  };
  V.hasCmp = !!V.P;
  return V;
}

/* growth attribution: GMV = traffic x conversion x AOV */
function decompose(C, P) {
  if (!P || C.traffic == null || P.traffic == null || !P.conv || !P.aov) return null;
  const t0 = P.traffic, c0 = P.conv, a0 = P.aov, t1 = C.traffic, c1 = C.conv, a1 = C.aov;
  if (c1 == null || a1 == null) return null;
  const trafficEff = (t1 - t0) * c0 * a0;
  const convEff = t1 * (c1 - c0) * a0;
  const aovEff = t1 * c1 * (a1 - a0);
  const total = trafficEff + convEff + aovEff;
  const parts = [
    { k: 'Traffic', v: trafficEff }, { k: 'Conversion', v: convEff }, { k: 'AOV', v: aovEff }
  ].sort((x, y) => Math.abs(y.v) - Math.abs(x.v));
  return { trafficEff, convEff, aovEff, total, parts, lead: parts[0] };
}

/* ============================ funnel component ============================ */
function funnel(A) {
  const maxV = A.traffic || 1;
  const steps = [
    { n: 'Visits', v: A.traffic, c: '#4B6A9B', r: null },
    { n: 'Add to cart', v: A.atc, c: '#2B57D0', r: 'ATC rate ' + pct(A.atcRate, 2) },
    { n: 'Orders', v: A.orders, c: '#1E6FA8', r: 'Conversion ' + pct(A.conv, 2) },
    { n: 'GMV', v: A.webGmv, c: '#0E7A63', r: 'AOV ' + money(A.aov), money: true }
  ];
  let h = '<div class="funnel">';
  steps.forEach((s, i) => {
    const w = s.money ? 100 : Math.max(6, ((s.v || 0) / maxV) * 100);
    h += '<div class="fstep"><div class="fl">' + s.n + '</div>' +
      '<div class="fbar" style="width:' + w + '%;background:' + s.c + '">' +
      (s.money ? money(s.v) : num(s.v)) + '</div>' +
      '<div class="fr">' + (s.r || '&nbsp;') + '</div></div>';
    if (i === 1) h += '<div class="fdrop">' + pct(A.atcToOrder, 1) + ' of carts convert to an order</div>';
  });
  h += '</div>';
  return h;
}

/* ============================ observation blocks ============================ */
function oia(title, o, i, a) {
  return '<div class="oia"><div class="t">' + title + '</div><dl>' +
    '<dt>Observation</dt><dd>' + o + '</dd>' +
    '<dt>Interpretation</dt><dd>' + i + '</dd>' +
    '<dt>Action</dt><dd>' + a + '</dd></dl></div>';
}
function insBox(kind, title, items) {
  if (!items.length) items = ['<span class="na">Nothing met the threshold for this period.</span>'];
  return '<div class="ins"><div class="ins-hd ' + kind + '">' + title + '</div><ul>' +
    items.map(i => '<li>' + i + '</li>').join('') + '</ul></div>';
}

/* ============================ channel helpers ============================ */
/* A = levels for the selected range · C = the current side of the comparison window
   (identical to A unless the range is being split) · P = the comparison window */
function channelRows(A, P, C) {
  C = C || A;
  return CHANNELS.map(c => {
    const g = A.ch[c.id].gmv, cg = C.ch[c.id].gmv, pg = P ? P.ch[c.id].gmv : null;
    const sp = A.ch[c.id].spend, csp = C.ch[c.id].spend;
    const psp = P ? P.ch[c.id].spend : null;
    let roas = null, roasLabel = '';
    if (c.id === 'website') { roas = A.webBlendRoas; roasLabel = 'GMV ÷ Meta+Google+BIK spend'; }
    if (c.id === 'amazon') { roas = A.amazonRoasRep.roas; roasLabel = 'ad-attributed, as reported'; }
    if (c.id === 'blinkit') { roas = A.blinkitRoas; roasLabel = 'ad sales ÷ ad spend'; }
    return {
      ...c, noSpend: !c.spend, gmv: g, curGmv: cg, prevGmv: pg, share: A.ch[c.id].share,
      spend: sp, curSpend: csp, prevSpend: psp,
      roas, roasLabel, growth: growth(cg, pg), delta: (cg != null && pg != null) ? cg - pg : null,
      spendGrowth: growth(csp, psp), missSpend: A.ch[c.id].missSpend,
      spendPerGmv: div(sp, g)
    };
  });
}
function filteredChannels() {
  return state.channel === 'all' ? CHANNELS : CHANNELS.filter(c => c.id === state.channel);
}

/* ================= derived story used by summary, insights and alerts ================= */
function story() {
  const A = V.A, C = V.C, P = V.P, s = { A, C, P, cmp: V.cmp };

  /* target performance, day by day */
  const withAch = A.rows.filter(r => r.d3pTarget && r.d3pActual != null)
    .map(r => ({ d: r.date, ach: r.d3pActual / r.d3pTarget, v: r.d3pActual - r.d3pTarget,
                 act: r.d3pActual, tgt: r.d3pTarget }));
  s.days = withAch;
  s.above = withAch.filter(x => x.ach >= 1).length;
  s.below = withAch.length - s.above;
  s.best = withAch.slice().sort((a, b) => b.ach - a.ach)[0];
  s.worst = withAch.slice().sort((a, b) => a.ach - b.ach)[0];
  s.bestVar = withAch.slice().sort((a, b) => b.v - a.v)[0];
  s.worstVar = withAch.slice().sort((a, b) => a.v - b.v)[0];
  s.latest = withAch[withAch.length - 1];

  const withDA = A.rows.filter(r => r.dabbleTarget && r.dabbleActual != null)
    .map(r => ({ d: r.date, ach: r.dabbleActual / r.dabbleTarget, v: r.dabbleActual - r.dabbleTarget }));
  s.dabbleAbove = withDA.filter(x => x.ach >= 1).length;
  s.dabbleDays = withDA;

  const withAZ = A.rows.filter(r => r.amzTgtPlan && r.amzTgtAct != null)
    .map(r => ({ d: r.date, ach: r.amzTgtAct / r.amzTgtPlan, v: r.amzTgtAct - r.amzTgtPlan }));
  s.amzAbove = withAZ.filter(x => x.ach >= 1).length;
  s.amzDays = withAZ;

  /* channel movement */
  s.channels = channelRows(A, P, C).sort((a, b) => (b.gmv || 0) - (a.gmv || 0));
  s.channelsAll = s.channels.slice();
  s.top = s.channels[0];
  const moved = s.channels.filter(c => c.delta != null);
  s.riser = moved.slice().sort((a, b) => b.delta - a.delta)[0];
  s.faller = moved.slice().sort((a, b) => a.delta - b.delta)[0];
  s.totalDelta = (C.gmv != null && P && P.gmv != null) ? C.gmv - P.gmv : null;

  /* spend and efficiency */
  s.gmvGrowth = P ? growth(C.gmv, P.gmv) : null;
  s.spendGrowth = P ? growth(C.spend, P.spend) : null;
  s.roasDelta = (P && C.blendedRoas != null && P.blendedRoas != null) ? C.blendedRoas - P.blendedRoas : null;
  s.spendGap = (s.gmvGrowth != null && s.spendGrowth != null) ? s.spendGrowth - s.gmvGrowth : null;
  const spendMoves = [
    { n: 'Meta', c: C.metaSpend, p: P && P.metaSpend }, { n: 'Google', c: C.googleSpend, p: P && P.googleSpend },
    { n: 'BIK', c: C.bikSpend, p: P && P.bikSpend }, { n: 'Amazon ads', c: C.amazonSpend, p: P && P.amazonSpend },
    { n: 'Blinkit ads', c: C.blinkitSpend, p: P && P.blinkitSpend }
  ].filter(x => x.c != null && x.p != null).map(x => ({ ...x, d: x.c - x.p, g: growth(x.c, x.p) }));
  s.spendMoves = spendMoves.sort((a, b) => b.d - a.d);
  s.spendUp = s.spendMoves[0];

  /* website funnel */
  s.dec = decompose(C, P);
  s.convDelta = (P && C.conv != null && P.conv != null) ? (C.conv - P.conv) * 10000 : null;
  s.aovGrowth = P ? growth(C.aov, P.aov) : null;
  s.trafficGrowth = P ? growth(C.traffic, P.traffic) : null;
  s.orderGrowth = P ? growth(C.orders, P.orders) : null;
  s.cpuGrowth = P ? growth(C.cpu, P.cpu) : null;

  /* customers */
  s.aovGap = (A.rbAovLine != null && A.nbAovLine != null) ? A.rbAovLine - A.nbAovLine : null;
  s.convGap = (A.rbConv != null && A.nbConv != null) ? (A.rbConv - A.nbConv) * 10000 : null;
  s.retRateDelta = (P && C.returningRate != null && P.returningRate != null)
    ? (C.returningRate - P.returningRate) * 10000 : null;
  s.cpuGap = (A.nbCpu != null && A.rbCpu != null) ? A.nbCpu - A.rbCpu : null;

  /* volatility (day-over-day, computed rather than read from the source column) */
  const dod = [];
  for (let i = 1; i < A.rows.length; i++) {
    const c = A.rows[i].totalGMV, p = A.rows[i - 1].totalGMV;
    if (c != null && p) dod.push({ d: A.rows[i].date, g: (c - p) / p, abs: c - p });
  }
  s.dod = dod;
  s.bestDod = dod.slice().sort((a, b) => b.g - a.g)[0];
  s.worstDod = dod.slice().sort((a, b) => a.g - b.g)[0];
  s.maxSwing = dod.slice().sort((a, b) => Math.abs(b.g) - Math.abs(a.g))[0];

  /* profitability by day */
  const prof = A.rows.filter(r => r.netRevenue != null && r.websiteGMV && r.markSpend != null)
    .map(r => ({ d: r.date, netRate: r.netRevenue / r.websiteGMV, markPct: r.markSpend / r.websiteGMV,
                 cpu: r.cpuSrc, roas: div(r.websiteGMV, r.websiteSpend) }));
  s.prof = prof;
  s.bestProf = prof.slice().sort((a, b) => (b.netRate - b.markPct) - (a.netRate - a.markPct))[0];
  s.worstProf = prof.slice().sort((a, b) => (a.netRate - a.markPct) - (b.netRate - b.markPct))[0];
  s.heaviestSpend = prof.slice().sort((a, b) => b.markPct - a.markPct)[0];
  s.leanestSpend = prof.slice().sort((a, b) => a.markPct - b.markPct)[0];

  /* concentration and availability */
  s.concentration = s.top ? s.top.share : null;
  s.missing = [];
  A.rows.forEach(r => {
    if (r.blinkitSpendState) s.missing.push({ d: r.date, m: 'Blinkit spend and ROAS ("' + r.blinkitSpendState + '")' });
    if (r.amzSessions === 0 && r.amzUnits > 0) s.missing.push({ d: r.date, m: 'Amazon sessions and page views recorded as 0 against ' + r.amzUnits + ' units ordered' });
  });
  return s;
}

/* ================= executive summary ================= */
function execSummary(s) {
  const A = s.A, P = s.P, ctx = P ? ' <span class="chip">' + s.cmp.label + '</span>' : '';
  const q = [];
  const push = (k, v) => q.push({ k, v });

  /* what is going well */
  const wins = [];
  if (A.dabbleAch != null && A.dabbleAch >= 1)
    wins.push('the website (Dabble) is at <b>' + pct(A.dabbleAch, 1) + '</b> of plan, ' + money(A.dabbleVar) + ' ahead on ' + s.dabbleAbove + ' of ' + s.dabbleDays.length + ' days');
  if (s.riser && s.riser.delta > 0)
    wins.push('<b>' + s.riser.name + '</b> added the most GMV, ' + sgnMoney(s.riser.delta) + ' (' + sgnPct(s.riser.growth) + ')');
  if (s.above > s.below) wins.push(s.above + ' of ' + s.days.length + ' days finished at or above the combined target');
  if (A.blendedRoas != null && A.blendedRoas >= CFG.roasFloor)
    wins.push('blended ROAS of <b>' + xs(A.blendedRoas) + '</b> on ' + money(A.spend) + ' of recorded spend');
  push('What is going well', wins.length ? wins.join('; ') + '.' : 'No metric cleared its threshold in this range.');

  /* underperforming */
  const bad = [];
  if (A.ach != null && A.ach < 1)
    bad.push('combined Dabble+3P GMV is <b>' + pct(A.ach, 1) + '</b> of plan, a shortfall of <b>' + money(Math.abs(A.variance)) + '</b>');
  if (s.faller && s.faller.delta < 0)
    bad.push('<b>' + s.faller.name + '</b> lost ' + money(Math.abs(s.faller.delta)) + ' (' + sgnPct(s.faller.growth) + ')');
  if (s.convDelta != null && s.convDelta < -CFG.convBps.watch)
    bad.push('website conversion is down <b>' + Math.abs(Math.round(s.convDelta)) + ' bps</b> to ' + pct(s.C.conv, 2));
  if (s.worst) bad.push(short(s.worst.d) + ' was the weakest day against target at ' + pct(s.worst.ach, 0));
  push('What is underperforming', bad.length ? bad.join('; ') + '.' : 'No metric breached its warning threshold.');

  /* what is driving GMV */
  if (s.dec) {
    const parts = s.dec.parts.map(p => p.k + ' ' + sgnMoney(p.v)).join(', ');
    push('What is driving website GMV',
      'Decomposing website GMV as traffic × conversion × AOV over the comparison window: ' + parts +
      '. The <b>' + s.dec.lead.k.toLowerCase() + '</b> term dominates, accounting for ' +
      pct(Math.abs(s.dec.lead.v) / (Math.abs(s.dec.trafficEff) + Math.abs(s.dec.convEff) + Math.abs(s.dec.aovEff)), 0) +
      ' of the gross movement.' + ctx);
  } else {
    push('What is driving website GMV', 'A traffic × conversion × AOV decomposition needs a comparison window; none is available for this range.');
  }

  /* biggest contributor */
  push('Which channel contributes most',
    '<b>' + s.top.name + '</b> at ' + money(s.top.gmv) + ', <b>' + pct(s.top.share, 1) + '</b> of GMV. ' +
    'Website is ' + pct(A.ch.website.share, 1) + ', Amazon ' + pct(A.ch.amazon.share, 1) + ', Blinkit ' +
    pct(A.ch.blinkit.share, 1) + ', FirstCry ' + pct(A.ch.firstcry.share, 1) + ', The Moms Store ' + pct(A.ch.moms.share, 1) + '.');

  /* where spend is increasing */
  if (s.spendMoves.length) {
    const up = s.spendMoves.filter(m => m.d > 0), dn = s.spendMoves.filter(m => m.d < 0);
    push('Where spend is moving',
      (up.length ? 'Up: ' + up.map(m => m.n + ' ' + sgnMoney(m.d) + ' (' + sgnPct(m.g, 0) + ')').join(', ') + '. ' : '') +
      (dn.length ? 'Down: ' + dn.map(m => m.n + ' ' + sgnMoney(m.d) + ' (' + sgnPct(m.g, 0) + ')').join(', ') + '.' : '') + ctx);
  } else push('Where spend is moving', 'No comparable prior spend to measure movement against.');

  /* is spend translating */
  if (s.spendGap != null) {
    const verdict = s.spendGap > CFG.spendGap ? 'Spend is growing faster than GMV'
      : s.spendGap < -CFG.spendGap ? 'GMV is growing faster than spend' : 'Spend and GMV are moving broadly together';
    push('Is spend translating into GMV',
      verdict + ': spend ' + sgnPct(s.spendGrowth) + ' against GMV ' + sgnPct(s.gmvGrowth) +
      '. Blended ROAS ' + xs(P.blendedRoas) + ' → <b>' + xs(s.C.blendedRoas) + '</b>, spend at ' +
      pct(A.spendGmvRatio, 1) + ' of GMV.' + ctx);
  } else push('Is spend translating into GMV', 'Blended ROAS is ' + xs(A.blendedRoas) + ' and spend is ' + pct(A.spendGmvRatio, 1) + ' of GMV. No prior period to measure the trend.');

  /* what changed */
  if (s.maxSwing)
    push('What changed recently',
      'Largest single-day move: ' + short(s.maxSwing.d) + ' at ' + sgnPct(s.maxSwing.g) + ' (' + money(s.maxSwing.abs) + ') day over day. ' +
      (s.latest ? 'The most recent day, ' + short(s.latest.d) + ', closed at ' + pct(s.latest.ach, 0) + ' of target (' + money(s.latest.act) + ' against ' + money(s.latest.tgt) + ').' : ''));
  else push('What changed recently', 'Fewer than two days in range; no day-over-day movement to report.');

  /* what to watch */
  const watch = [];
  if (s.concentration != null && s.concentration > CFG.concentration)
    watch.push('<b>' + pct(s.concentration, 1) + '</b> of GMV sits in ' + s.top.name + ', above the ' + pct(CFG.concentration, 0) + ' concentration threshold');
  if (s.missing.length) watch.push(s.missing.length + ' recorded gaps in spend or traffic data (see Insights & Actions)');
  if (s.aovGap != null && s.aovGap > 0)
    watch.push('returning customers spend ' + money(s.aovGap) + ' more per order than first-time buyers');
  if (A.cpu != null) watch.push('website CPU at ' + money(A.cpu) + ' against AOV of ' + money(A.aov));
  push('What management should watch', watch.length ? watch.join('; ') + '.' : 'No standing watch items for this range.');

  return q;
}

/* ================= alerts and CEO insights ================= */
function alerts(s) {
  const A = s.A, C = s.C, P = s.P, out = { good: [], watch: [], crit: [], act: [] };
  const G = t => out.good.push(t), W = t => out.watch.push(t), R = t => out.crit.push(t), ACT = t => out.act.push(t);

  /* --- target --- */
  if (A.ach != null) {
    const line = 'Combined Dabble+3P GMV ' + money(A.gmvForPlan) + ' against a plan of ' + money(A.target) +
      ' — <b>' + pct(A.ach, 1) + '</b> of target, ' + money(A.variance) + ' variance over ' + A.targetDays +
      (A.targetDays < A.days ? ' of ' + A.days : '') + ' days.';
    if (A.ach >= CFG.ach.watch) G(line); else if (A.ach >= CFG.ach.weak) W(line); else R(line);
  }
  if (A.dabbleAch != null) {
    const line = 'Website (Dabble) GMV ' + money(A.dabbleGmv) + ' against ' + money(A.dabbleTgt) +
      ' — <b>' + pct(A.dabbleAch, 1) + '</b> of plan, ' + money(A.dabbleVar) + ' variance.';
    if (A.dabbleAch >= CFG.ach.watch) G(line); else if (A.dabbleAch >= CFG.ach.weak) W(line); else R(line);
  }
  if (s.below > s.above && s.days.length)
    W(s.below + ' of ' + s.days.length + ' days finished below the combined target; the weakest was ' +
      short(s.worst.d) + ' at ' + pct(s.worst.ach, 0) + ' (' + money(s.worst.v) + ').');

  /* --- conversion --- */
  if (s.convDelta != null) {
    const line = 'Website conversion ' + pct(P.conv, 2) + ' → <b>' + pct(C.conv, 2) + '</b> (' +
      (s.convDelta > 0 ? '+' : '') + Math.round(s.convDelta) + ' bps) ' + s.cmp.label + '.';
    if (s.convDelta <= -CFG.convBps.weak) R(line);
    else if (s.convDelta <= -CFG.convBps.watch) W(line);
    else if (s.convDelta >= CFG.convBps.watch) G(line);
  }
  /* --- AOV --- */
  if (s.aovGrowth != null) {
    const line = 'Website AOV ' + money(P.aov) + ' → <b>' + money(C.aov) + '</b> (' + sgnPct(s.aovGrowth) + ') ' + s.cmp.label + '.';
    if (s.aovGrowth <= -CFG.aovPct.weak) R(line);
    else if (s.aovGrowth <= -CFG.aovPct.watch) W(line);
    else if (s.aovGrowth >= CFG.aovPct.watch) G(line);
  }
  /* --- ROAS --- */
  if (P && C.blendedRoas != null && P.blendedRoas != null) {
    const g = growth(C.blendedRoas, P.blendedRoas);
    const line = 'Blended ROAS ' + xs(P.blendedRoas) + ' → <b>' + xs(C.blendedRoas) + '</b> (' + sgnPct(g) + ') ' + s.cmp.label + '.';
    if (g <= -CFG.roasPct.weak) R(line); else if (g <= -CFG.roasPct.watch) W(line); else if (g >= CFG.roasPct.watch) G(line);
  }
  /* --- spend vs GMV --- */
  if (s.spendGap != null && s.spendGap > CFG.spendGap)
    R('Recorded spend grew ' + sgnPct(s.spendGrowth) + ' while GMV grew ' + sgnPct(s.gmvGrowth) +
      ' — a ' + (s.spendGap * 100).toFixed(1) + ' point gap. Spend is ' + pct(A.spendGmvRatio, 1) + ' of GMV' +
      (s.spendUp && s.spendUp.d > 0 ? ', led by ' + s.spendUp.n + ' at ' + money(s.spendUp.d) + '.' : '.'));
  else if (s.spendGap != null && s.spendGap < -CFG.spendGap)
    G('GMV grew ' + sgnPct(s.gmvGrowth) + ' on spend growth of ' + sgnPct(s.spendGrowth) + ' — efficiency improved ' + s.cmp.label + '.');

  /* --- CPU --- */
  if (s.cpuGrowth != null && A.cpu != null && A.aov != null) {
    if (s.cpuGrowth > CFG.aovPct.watch)
      W('Website cost per order ' + money(P.cpu) + ' → <b>' + money(C.cpu) + '</b> (' + sgnPct(s.cpuGrowth) +
        '), now ' + pct(div(A.cpu, A.aov), 1) + ' of AOV.');
  }
  /* --- volatility --- */
  if (s.maxSwing && Math.abs(s.maxSwing.g) > CFG.volatility)
    W('GMV moved ' + sgnPct(s.maxSwing.g) + ' (' + money(s.maxSwing.abs) + ') on ' + short(s.maxSwing.d) +
      ', beyond the ' + pct(CFG.volatility, 0) + ' day-over-day band.');

  /* --- concentration --- */
  if (s.concentration != null && s.concentration > CFG.concentration)
    W(s.top.name + ' carries <b>' + pct(s.concentration, 1) + '</b> of GMV (' + money(s.top.gmv) +
      '), above the ' + pct(CFG.concentration, 0) + ' concentration threshold. Website is ' + pct(A.ch.website.share, 1) + '.');

  /* --- missing data --- */
  const uniq = {}; s.missing.forEach(m => { uniq[m.m] = (uniq[m.m] || []).concat(short(m.d)); });
  Object.keys(uniq).forEach(k => W('Data unavailable: ' + k + ' on ' + uniq[k].join(', ') + '. Held as unavailable, not as zero.'));
  if (A.googleSpend === 0) W('Google Ads spend is recorded as ₹0 on every day in range with ROAS recorded as 0x. This is a recorded zero, not a blank — no inference is made about whether the channel ran.');

  /* --- customer mix --- */
  if (s.retRateDelta != null && Math.abs(s.retRateDelta) >= 200) {
    const line = 'Returning share of orders ' + pct(P.returningRate, 1) + ' → <b>' + pct(C.returningRate, 1) +
      '</b> (' + (s.retRateDelta > 0 ? '+' : '') + Math.round(s.retRateDelta) + ' bps) ' + s.cmp.label + '.';
    (s.retRateDelta > 0 ? W : G)(line);
  }

  /* --- actions --- */
  if (A.ach != null && A.ach < 1 && s.faller && s.faller.delta < 0)
    ACT('Close the ' + money(Math.abs(A.variance)) + ' plan gap: ' + s.faller.name + ' is the largest negative mover at ' +
        money(s.faller.delta) + '. Confirm whether the drop is supply, price or demand before reallocating budget.');
  if (s.dec && s.dec.lead.k === 'Conversion' && s.dec.convEff < 0)
    ACT('Website GMV is losing ' + money(Math.abs(s.dec.convEff)) + ' to conversion. Audit the ' +
        pct(A.atcToOrder, 1) + ' cart-to-order step before adding traffic spend.');
  if (s.dec && s.dec.lead.k === 'Traffic' && s.dec.trafficEff < 0)
    ACT('Traffic is the largest drag at ' + money(s.dec.trafficEff) + ' of website GMV. Check paid delivery and Meta spend pacing, currently ' + money(A.metaSpend) + ' in range.');
  if (s.spendGap != null && s.spendGap > CFG.spendGap && s.spendUp)
    ACT('Put ' + s.spendUp.n + ' on an efficiency review: it added ' + money(s.spendUp.d) + ' of spend ' + s.cmp.label +
        ' without proportionate GMV. Set a ROAS floor of ' + xs(CFG.roasFloor) + ' before further scaling.');
  if (A.rbAovLine != null && A.nbAovLine != null && A.rbAovLine > A.nbAovLine)
    ACT('Returning buyers order at ' + money(A.rbAovLine) + ' against ' + money(A.nbAovLine) + ' for first-time buyers, with acquisition CPU at ' +
        money(A.nbCpu) + ' versus ' + money(A.rbCpu) + ' for retention. Protect the repeat base while holding new-buyer CPU.');
  if (s.missing.length)
    ACT('Close the data gaps listed above before the next review; ' + s.missing.length + ' recorded values are unavailable and are excluded from totals rather than counted as zero.');
  if (A.cancelledOrders)
    ACT(A.cancelledOrders + ' website orders in range are marked cancelled in the sales report. Confirm whether GMV should be reported net of them.');
  return out;
}

/* ============================================================================
   TAB 1 — Executive overview
   ========================================================================== */
function heroBlock(A) {
  const ach = A.ach, scale = Math.max(1.2, (ach || 1) * 1.08);
  const w = ach == null ? 0 : Math.min(100, (ach / scale) * 100);
  const notch = (1 / scale) * 100;
  const col = ach == null ? 'var(--mute)' : ach >= 1 ? 'var(--pos)' : ach >= CFG.ach.weak ? 'var(--warn)' : 'var(--neg)';

  return '<div class="hero"><div class="hero-top">' +
    '<div class="who">Dabble + 3P · <b>' + rangeLabel(A.from, A.to) + '</b> · ' + A.days + ' days' +
    (state.channel !== 'all' ? ' · focus <b>' + CHANNELS.find(c => c.id === state.channel).name + '</b>' : '') + '</div>' +
    '<div class="who">Latest day in workbook <b>' + short(MAX_D) + ' ' + d2(MAX_D).getUTCFullYear() + '</b></div></div>' +
    '<div class="hero-body">' +
      '<div><div class="hero-num">' + money(A.gmv) + '</div>' +

        '<div class="bar-fill" style="width:' + w + '%;background:' + col + '"></div>' +
        '<div class="bar-notch" style="left:' + notch + '%"><span>target ' + money(A.target) + '</span></div>' +
      '</div><div class="bar-legend"><span>' + rangeLabel(A.from, A.to) + '</span><span>' +
        (A.variance == null ? '' : (A.variance >= 0 ? 'ahead of plan by ' : 'short of plan by ') + money(Math.abs(A.variance))) +

}

  const bv = dd.length ? dd.slice().sort((a, b) => b.v - a.v)[0] : null;

      '<td class="' + ((r.d3pActual - r.d3pTarget) >= 0 ? 'pos' : 'neg') + '">' + sgnMoney(r.d3pActual - r.d3pTarget) + '</td></tr>';
  });
  const foot = '<td class="l">Total</td><td></td><td></td><td>' + money(A.dabbleTgt) + '</td><td>' + money(A.dabbleGmv) +
    '</td><td>' + pct(A.dabbleAch, 0) + '</td><td>' + money(A.dabbleVar) + '</td><td>' + money(A.target) +
    '</td><td>' + money(A.gmvForPlan) + '</td><td>' + pct(A.ach, 0) + '</td><td>' + money(A.variance) + '</td>';
  h += sec('Day by day', '', card('', '', table(
    [{ n: 'Date', l: 1 }, { n: 'Day', l: 1 }, { n: 'Event', l: 1 },

     { n: 'D+3P plan' }, { n: 'D+3P actual' }, { n: 'Ach' }, { n: '₹ variance' }], rows, foot), 'pad0'));
  return h;

function tabFunnel() {
  const A = V.A, C = V.C, P = V.P, s = story();
  let h = sec('Funnel for ' + rangeLabel(A.from, A.to), 'traffic → add to cart → orders → GMV',
    '<div class="grid g32">' +
    card('', '', funnel(A)) +
    card('Funnel rates', 'aggregated across the range, not averaged across days',
      '<div class="grid g3" style="gap:10px">' +
      kpi('ATC rate', pct(A.atcRate, 2), V.hasCmp ? deltaBps(C.atcRate, P.atcRate) : NC, { sm: true }) +
      kpi('Conversion', pct(A.conv, 2), V.hasCmp ? deltaBps(C.conv, P.conv) : NC, { sm: true }) +
      kpi('Cart to order', pct(A.atcToOrder, 1), V.hasCmp ? deltaBps(C.atcToOrder, P.atcToOrder) : NC, { sm: true }) +
      kpi('AOV', money(A.aov), V.hasCmp ? deltaPct(C.aov, P.aov) : NC, { sm: true }) +
      kpi('Revenue per visit', money(A.rpv), V.hasCmp ? deltaPct(C.rpv, P.rpv) : NC, { sm: true }) +
      kpi('Cost per order', money(A.cpu), V.hasCmp ? deltaPct(C.cpu, P.cpu, true) : NC, { sm: true }) +
      '</div>') +
    '</div>');

  h += sec('Daily funnel trend', '',
    '<div class="grid g2">' +
    card('Traffic and conversion', 'bars are visits, the line is conversion', canvas('t3_trend', 'h240')) +
    card('Orders and AOV', 'bars are orders, the line is AOV', canvas('t3_aov', 'h240')) + '</div>');

  /* diagnosis */
  const d = s.dec;
  let dh;
  if (!d) {
    dh = '<div class="note a">A traffic × conversion × AOV decomposition needs a comparison window. None is available for this selection — widen the range or change the comparison basis.</div>';
  } else {
    const dir = (v, up, down, flat) => Math.abs(v) < 0.005 ? flat : v > 0 ? up : down;
    const tD = s.trafficGrowth, cD = s.convDelta, aD = s.aovGrowth;
    const verdict =
      d.lead.k === 'Traffic' ? (d.trafficEff > 0 ? 'Traffic-led growth' : 'Traffic-led decline')
      : d.lead.k === 'Conversion' ? (d.convEff > 0 ? 'Conversion-led growth' : 'Conversion-led decline')
      : (d.aovEff > 0 ? 'AOV-led growth' : 'AOV-led decline');
    const mixed = (Math.abs(d.parts[1].v) / Math.abs(d.lead.v) > 0.6) ? ' with a material second driver' : '';
    dh = '<div class="grid g23">' +
      card(verdict + mixed, s.cmp.label, canvas('t3_dec', 'h200')) +
      oia('Funnel diagnosis',
        'Visits ' + num(P.traffic) + ' → ' + num(C.traffic) + ' (' + sgnPct(tD) + '), conversion ' + pct(P.conv, 2) + ' → ' + pct(C.conv, 2) +
          ' (' + (cD > 0 ? '+' : '−') + Math.abs(Math.round(cD)) + ' bps), AOV ' + money(P.aov) + ' → ' + money(C.aov) + ' (' + sgnPct(aD) + '). ' +
          'Website GMV moved ' + sgnMoney(d.total) + '.',
        'The data indicates the movement is ' + verdict.toLowerCase() + ': the ' + d.lead.k.toLowerCase() + ' term contributes ' +
          sgnMoney(d.lead.v) + ' of the ' + sgnMoney(d.total) + ' change, against ' + d.parts.slice(1).map(p => p.k.toLowerCase() + ' ' + sgnMoney(p.v)).join(' and ') + '. ' +
          dir(tD, 'Traffic rose while ', 'Traffic fell while ', 'Traffic was broadly flat while ') +
          dir(cD / 10000, 'conversion improved.', 'conversion deteriorated.', 'conversion held.'),
        d.lead.k === 'Conversion' && d.convEff < 0
          ? 'Protect conversion before adding traffic spend: audit the ' + pct(A.atcToOrder, 1) + ' cart-to-order step and the ' + pct(A.atcRate, 2) + ' add-to-cart rate.'
          : d.lead.k === 'Traffic' && d.trafficEff < 0
            ? 'Investigate the traffic decline against Meta spend of ' + money(A.metaSpend) + ' in range, while holding conversion at ' + pct(A.conv, 2) + '.'
            : 'Hold the mix that is producing ' + money(A.aov) + ' AOV and test whether it survives a traffic increase.') +
      '</div>';
  }
  h += sec('Funnel diagnosis', 'decomposed as GMV = traffic × conversion × AOV', dh);

  /* customers */
  const rb = A.rbOrders, nb = A.nbOrders;
  h += sec('Returning against new', 'returning and new visitor counts cover about ' +
    pct(div((A.rbTraffic || 0) + (A.nbTraffic || 0), A.traffic), 0) + ' of sessions, so share is reported on orders',
    '<div class="grid g23">' +
    card('Split by customer type', 'RB = returning buyers, NB = new buyers', table(
      [{ n: 'Metric', l: 1 }, { n: 'Returning' }, { n: 'New' }, { n: 'Gap' }],
      [
        ['Identified visits', num(A.rbTraffic), num(A.nbTraffic), num((A.rbTraffic || 0) - (A.nbTraffic || 0))],
        ['Orders', num(rb), num(nb), num((rb || 0) - (nb || 0))],
        ['Order share', pct(div(rb, rb + nb), 1), pct(div(nb, rb + nb), 1), ''],
        ['Conversion', pct(A.rbConv, 2), pct(A.nbConv, 2), (s.convGap == null ? NA : (s.convGap > 0 ? '+' : '') + Math.round(s.convGap) + ' bps')],
        ['AOV (order lines)', money(A.rbAovLine), money(A.nbAovLine), money(s.aovGap)],
        ['GMV (order lines)', money(A.lineRB.s), money(A.lineNB.s), ''],
        ['Recorded spend', money(A.rbSpend), money(A.nbSpend), money((A.rbSpend || 0) - (A.nbSpend || 0))],
        ['Cost per order', money(A.rbCpu), money(A.nbCpu), money(s.cpuGap == null ? null : -s.cpuGap)]
      ].map(r => '<tr><td class="l">' + r[0] + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td><td>' + r[3] + '</td></tr>'))) +
    card('Returning share of orders by day', '', canvas('t3_cust', 'h240')) +
    '</div>' +
    '<div class="grid" style="margin-top:12px">' +
    oia('Is the site acquiring, or leaning on repeat demand?',
      'Returning buyers placed ' + num(rb) + ' of ' + num(rb + nb) + ' orders (' + pct(A.returningRate, 1) + ') and converted at ' +
        pct(A.rbConv, 2) + ' against ' + pct(A.nbConv, 2) + ' for new visitors. Order-line AOV is ' + money(A.rbAovLine) +

function spendRows(A, P, C) {

    if (s.id === 'google') { roas = null; basis = 'spend recorded as ₹0; ROAS recorded as 0x'; }

}

      '</td><td class="l" style="white-space:normal;color:var(--text-3);font-size:11.5px">website GMV ÷ (Meta + Google + BIK spend)</td></tr>' +
      '<tr><td class="l">Amazon on total GMV</td><td>' + money(A.amazonSpend) + '</td><td>' + xs(A.amazonRoasGmv) +
      '</td><td class="l" style="white-space:normal;color:var(--text-3);font-size:11.5px">total Amazon GMV ÷ Amazon ad spend, for scale reference</td></tr>' +
      '<tr><td class="l">Business blended</td><td>' + money(A.spend) + '</td><td>' + xs(A.blendedRoas) +
      '</td><td class="l" style="white-space:normal;color:var(--text-3);font-size:11.5px">total GMV ÷ total recorded spend</td></tr>')) +
    '</div>');

  /* quadrants */
  const q = sr.filter(x => x.v != null && x.v > 0 && x.roas != null);
  const med = q.length ? q.map(x => x.v).sort((a, b) => a - b)[Math.floor(q.length / 2)] : null;
  const bucket = x => (x.v >= med ? 'High spend' : 'Low spend') + ' + ' + (x.roas >= CFG.roasFloor ? 'high ROAS' : 'low ROAS');
  const buckets = {
    'High spend + high ROAS': { t: 'Scale candidate', k: 'g', items: [] },
    'High spend + low ROAS': { t: 'Optimisation priority', k: 'r', items: [] },
    'Low spend + high ROAS': { t: 'Test and scale', k: 'b', items: [] },
    'Low spend + low ROAS': { t: 'Monitor only', k: 'a', items: [] }
  };
  q.forEach(x => buckets[bucket(x)].items.push(x.n + ' · ' + money(x.v) + ' at ' + xs(x.roas)));
  h += sec('Where to put the next rupee',
    q.length < 2 ? 'not enough platforms with both spend and ROAS to classify'
      : 'split at the median platform spend of ' + money(med) + ' and a ROAS reference of ' + xs(CFG.roasFloor),
    q.length < 2 ? '<div class="note a">Classification needs at least two platforms with both a recorded spend and a usable ROAS in the selected range.</div>'
      : '<div class="grid g2">' + card('Spend against ROAS', 'bubble size is channel GMV', canvas('t5_quad', 'h280')) +
        '<div class="grid" style="gap:12px">' + Object.keys(buckets).map(k =>
          insBox(buckets[k].k, buckets[k].t + ' — ' + k.toLowerCase(), buckets[k].items)).join('') + '</div></div>');

  h += '<div class="note" style="margin-top:14px"><b>Reading a zero.</b> A recorded ₹0 means the workbook records zero spend for that day — Google ads is ₹0 on every day in range. ' +
    'It is not evidence that the channel was switched off, and no such inference is made here. A blank or non-numeric value such as ' +
    (missTokens.length ? missTokens.map(t => '"' + t + '"').join(' / ') : '"Not Updated"') + ' is a different thing entirely and is held as unavailable.</div>';
  return h;
}

function monthAgg(k) { return agg(D.filter(r => r.date.slice(0, 7) === k)); }
function tabTrends() {

        (typeof cur === 'number' && typeof prev === 'number' ? deltaPct(cur, prev) : NC)) + '</td>';
    }).join('') + '</tr>';

  let h = '';

    months.map(monthLabel).join(', ') + '.</b> ' +
    (single ? 'Only one month of daily data exists (' + rangeLabel(MIN_D, MAX_D) + '), so month-on-month growth cannot be calculated and no prior month has been simulated. ' +
      'The month table below reports the month to date; the period comparison engine underneath is the closest available substitute.'
      : 'Month-on-month growth is calculated against the immediately preceding month.') + '</div>';

  h += sec('Overall month on month', 'month to date where the month is incomplete',
    card('', '', table(momHead, [
      momRow('Total GMV', a => a.gmv, money),
      momRow('Target', a => a.target, money),

      momRow('Recorded spend', a => a.spend, money),
      momRow('Blended ROAS', a => a.blendedRoas, v => xs(v)),
      momRow('Website GMV', a => a.ch.website.gmv, money),
      momRow('Amazon GMV', a => a.ch.amazon.gmv, money),
      momRow('Blinkit GMV', a => a.ch.blinkit.gmv, money),
      momRow('BIK GMV (in website)', a => a.bikGmv, money),
      momRow('Other 3P GMV', a => a.other3p, money)
    ].join('')), 'pad0'));

  h += sec('Website month on month', '',
    card('', '', table(momHead, [
      momRow('Traffic', a => a.traffic, v => num(v)),
      momRow('Add to cart', a => a.atc, v => num(v)),
      momRow('Orders', a => a.orders, v => num(v)),
      momRow('Conversion', a => a.conv, v => pct(v, 2)),

      momRow('GMV', a => a.webGmv, money),
      momRow('Cost per order', a => a.cpu, money),
      momRow('Marketing spend', a => a.markSpend, money),
      momRow('Returning share of orders', a => a.returningRate, v => pct(v, 1))
    ].join('')), 'pad0'));

    card('', '', table(
      [{ n: 'Channel', l: 1 }].concat(MA.flatMap(m => [{ n: monthLabel(m.k) + ' GMV' }, { n: 'Share' }, { n: 'Spend' }, { n: 'ROAS' }, { n: 'MoM' }])),

  const rowsCmp = [
    ['Total GMV', C.gmv, P && P.gmv, money, 'pct'],
    ['Target', C.target, P && P.target, money, 'pct', 'n'],
    ['Achievement', C.ach, P && P.ach, v => pct(v, 1), 'bps'],
    ['Recorded spend', C.spend, P && P.spend, money, 'pct', 'n'],
    ['Blended ROAS', C.blendedRoas, P && P.blendedRoas, v => xs(v), 'pct'],
    ['Website GMV', C.ch.website.gmv, P && P.ch.website.gmv, money, 'pct'],
    ['Website traffic', C.traffic, P && P.traffic, v => num(v), 'pct'],
    ['Conversion', C.conv, P && P.conv, v => pct(v, 2), 'bps'],
    ['AOV', C.aov, P && P.aov, money, 'pct'],
    ['Orders', C.orders, P && P.orders, v => num(v), 'pct'],
    ['Cost per order', C.cpu, P && P.cpu, money, 'pct'],
    ['Amazon GMV', C.ch.amazon.gmv, P && P.ch.amazon.gmv, money, 'pct'],
    ['Blinkit GMV', C.ch.blinkit.gmv, P && P.ch.blinkit.gmv, money, 'pct'],
    ['Returning share of orders', C.returningRate, P && P.returningRate, v => pct(v, 1), 'bps']
  ];
  h += sec('Period comparison engine', V.hasCmp ? V.cmp.label : 'no comparison available',
    (V.hasCmp ? '' : '<div class="note a" style="margin-bottom:10px">' + (V.cmp.note || '') + '</div>') +
    card('', '', table(
      [{ n: 'Metric', l: 1 }, { n: 'Comparison period' }, { n: 'Current' }, { n: 'Absolute change' }, { n: 'Change' }],
      rowsCmp.map(r => {
        const [n, c, p, f, kind, nu] = r;
        const d = (c != null && p != null) ? c - p : null;
        const abs = d == null ? '—'
          : kind === 'bps' ? (d > 0 ? '+' : '−') + Math.abs(Math.round(d * 10000)) + ' bps'
          : f === money ? sgnMoney(d) : (d > 0 ? '+' : '') + f(d);
        return '<tr><td class="l">' + n + '</td><td>' + (p == null ? NC : f(p)) + '</td><td>' + (c == null ? NA : f(c)) +
          '</td><td>' + abs + '</td><td>' + (kind === 'bps' ? deltaBps(c, p, nu) : deltaPct(c, p, nu)) + '</td></tr>';
      }).join('')), 'pad0'));

  /* trend charts with metric toggles */
  const tog = (key, list, def) => {
    const on = state.toggles[key] || def;
    return '<div class="toggles">' + list.map(m => '<button class="' + (on.includes(m) ? 'on' : '') +
      '" onclick="toggleMetric(\'' + key + '\',\'' + m + '\',\'' + def.join('|') + '\')">' + m + '</button>').join('') + '</div>';
  };
  h += sec('Overall trend', tog('trOv', ['GMV', 'Target', 'Spend', 'ROAS', 'Achievement'], ['GMV', 'Target']),
    card('', '', canvas('t7_overall', 'h280')));
  h += sec('Website trend', tog('trWeb', ['Traffic', 'Conversion', 'Orders', 'AOV', 'GMV', 'CPU'], ['Traffic', 'Conversion']),
    card('', '', canvas('t7_web', 'h280')));
  h += sec('Channel trend', 'GMV by channel, daily',
    card('', '', canvas('t7_chan', 'h280')));
  return h;
}

function tabInsights() {
  const A = V.A, C = V.C, P = V.P, s = story(), al = alerts(s);
  let h = sec('What the selected period says', rangeLabel(A.from, A.to) + (V.hasCmp ? ' · compared with ' + V.cmp.label : ''),
    '<div class="grid g2">' +
    insBox('r', '🔴 Critical exceptions', al.crit) +
    insBox('a', '🟠 Needs attention', al.watch) +
    insBox('g', '🟢 What is going well', al.good) +
    insBox('b', '📌 Management actions', al.act) + '</div>');

  /* observation / interpretation / action */
  const blocks = [];
  if (A.ach != null)
    blocks.push(oia('Position against plan',
      'Combined GMV of ' + money(A.gmvForPlan) + ' against a plan of ' + money(A.target) + ' is ' + pct(A.ach, 1) +
        ' of target, a variance of ' + money(A.variance) + ' across ' + A.targetDays + (A.targetDays < A.days ? ' of ' + A.days : '') +
        ' days. Website alone is at ' + pct(A.dabbleAch, 1) +
        ' of its plan while the combined figure is ' + pct(A.ach, 1) + '.',
      A.dabbleAch > A.ach
        ? 'The website is carrying the plan and the marketplaces are the source of the shortfall: website is ' +
          money(A.dabbleVar) + ' ahead while the combined position is ' + money(A.variance) + '.'
        : 'The marketplaces are covering for a website that is behind its own plan.',
      A.ach < 1
        ? 'Rebase the marketplace plan or fund the gap: ' + money(Math.abs(A.variance)) + ' over ' + A.targetDays +
          ' days runs at ' + money(Math.abs(A.variance) / A.targetDays) + ' a day.'
        : 'Hold the current plan and confirm the target itself is not set too low, given ' + s.above + ' of ' + s.days.length + ' days cleared it.'));

  if (s.dec)
    blocks.push(oia('What is moving website GMV',
      'Over ' + s.cmp.label + ', website GMV moved ' + sgnMoney(s.dec.total) + '. Traffic contributed ' + sgnMoney(s.dec.trafficEff) +
        ', conversion ' + sgnMoney(s.dec.convEff) + ' and AOV ' + sgnMoney(s.dec.aovEff) + '.',
      'The data indicates ' + (/^[aeiou]/i.test(s.dec.lead.k) ? 'an ' : 'a ') + s.dec.lead.k.toLowerCase() + '-led movement: that term alone accounts for ' + sgnMoney(s.dec.lead.v) +
        ' of the change. No causal driver is asserted here; the decomposition only attributes the arithmetic.',
      s.dec.lead.k === 'Traffic' && s.dec.trafficEff < 0
        ? 'Start with the traffic decline of ' + num(Math.round(P.traffic - C.traffic)) + ' visits' +
          (s.dec.convEff < 0 ? ', then the ' + money(Math.abs(s.dec.convEff)) + ' conversion drag behind it.' : ', while protecting the conversion rate that is currently holding.')
        : s.dec.lead.k === 'Conversion' && s.dec.convEff < 0
          ? 'Treat conversion as the priority: it is removing ' + money(Math.abs(s.dec.convEff)) + ' before any traffic decision.'
          : s.dec.lead.k === 'AOV' && s.dec.aovEff < 0
            ? 'Check basket mix and discounting: AOV is removing ' + money(Math.abs(s.dec.aovEff)) + ' on its own.'
            : 'Sustain what is working and test whether it holds at higher traffic volume.'));

  if (s.spendGap != null)
    blocks.push(oia('Spend efficiency',
      'Recorded spend moved ' + sgnPct(s.spendGrowth) + ' while GMV moved ' + sgnPct(s.gmvGrowth) + '. Blended ROAS went from ' +
        xs(P.blendedRoas) + ' to ' + xs(C.blendedRoas) + ', with spend at ' + pct(A.spendGmvRatio, 1) + ' of GMV for the full range.',
      s.spendGap > CFG.spendGap
        ? 'Spend is clearly outrunning revenue: each additional rupee is buying materially less GMV than it did in the comparison window.'
        : s.spendGap > 0
          ? 'Spend is running slightly ahead of revenue — a ' + (s.spendGap * 100).toFixed(1) + ' point gap, inside the ' +
            pct(CFG.spendGap, 0) + ' tolerance but pointed the wrong way.'
          : 'Revenue is outrunning spend, so efficiency has improved over the comparison window.',
      s.spendGap > CFG.spendGap
        ? 'Freeze incremental budget on the fastest-growing line until ROAS recovers to ' + xs(CFG.roasFloor) + '.'
        : s.spendGap > 0
          ? 'Hold budget flat and watch the gap: it becomes an escalation if it passes ' + pct(CFG.spendGap, 0) + '.'
          : 'Consider testing incremental budget while the efficiency holds, with a stop-loss at ' + xs(CFG.roasFloor) + '.'));

  if (s.concentration != null)
    blocks.push(oia('Channel concentration',
      s.top.name + ' accounts for ' + pct(s.top.share, 1) + ' of GMV (' + money(s.top.gmv) + '). The next largest is ' +
        s.channelsAll.sort((a, b) => (b.gmv || 0) - (a.gmv || 0))[1].name + ' at ' +
        pct(s.channelsAll.sort((a, b) => (b.gmv || 0) - (a.gmv || 0))[1].share, 1) + '.',
      s.concentration > CFG.concentration
        ? 'Revenue is concentrated above the ' + pct(CFG.concentration, 0) + ' threshold, so a policy, listing or fee change at ' + s.top.name + ' would move the whole business.'
        : 'The mix is reasonably spread, so no single channel currently dictates the total.',
      s.concentration > CFG.concentration
        ? 'Set a concentration ceiling and a contingency for ' + s.top.name + ' disruption; track owned-channel share weekly.'
        : 'Keep monitoring; no action required at this level of spread.'));

  h += sec('Observation, interpretation, action', 'the interpretation column states what the data supports, not what caused it',
    '<div class="grid g2">' + blocks.join('') + '</div>');

  /* reconciliation */
  h += sec('Reconciliation of headline totals', 'run against the workbook before any figure was displayed',
    card('', '', DATA.recon.map(r =>
      '<div class="recon-row"><div><div class="n">' + r.check + '</div><div class="x">' + r.note + '</div></div>' +
      '<div class="r">' + (r.status === 'pass' ? stateChip('g', 'reconciles') : r.status === 'flag' ? stateChip('r', 'discrepancy') : stateChip('a', 'unavailable')) +
      '<div style="margin-top:4px;color:var(--text-3)">' + (r.a == null ? '' : inr(r.a) + ' vs ' + inr(r.b) +
        (r.delta ? ' · Δ ' + inr(r.delta) : ' · exact')) + '</div></div></div>').join('')));

  /* data availability */
  h += sec('Data availability', 'these states are preserved throughout the dashboard and never replaced with zero',
    '<div class="grid g2">' + DATA.dq.map(d =>
      '<div class="oia"><div class="t">' + (d.level === 'warn' ? '🟠 ' : '⚪ ') + d.title + '</div>' +
      '<div style="font-size:12.6px;line-height:1.55;color:var(--text-2)">' + d.detail + '</div></div>').join('') + '</div>');
  return h;
}

function applyPreset(id) {
  const last = MAX_D;
  const clamp = d => d < MIN_D ? MIN_D : d > MAX_D ? MAX_D : d;
  if (id === 'latest') { state.start = state.end = last; }
  else if (id === 'prev') { const p = ALL_DATES[ALL_DATES.length - 2] || last; state.start = state.end = p; }
  else if (id === 'last7') { state.end = last; state.start = clamp(addDays(last, -6)); }
  else if (id === 'prev7') { state.end = clamp(addDays(last, -7)); state.start = clamp(addDays(last, -13)); }
  else if (id === 'mtd') { state.end = last; state.start = clamp(last.slice(0, 8) + '01'); }
  else if (id === 'prevmonth') {
    const m = DATA.months[DATA.months.indexOf(last.slice(0, 7)) - 1];
    if (!m) { alert('The workbook contains only ' + DATA.months.map(monthLabel).join(', ') + '. There is no previous month to show.'); return false; }
    const ds = ALL_DATES.filter(d => d.slice(0, 7) === m);
    state.start = ds[0]; state.end = ds[ds.length - 1];
  } else if (id === 'all') { state.start = MIN_D; state.end = MAX_D; }
  state.preset = id;
  return true;
}
function setToggle(k, v) { state.toggles[k] = v; render(); }
function setSort(k, v) { state.sort[k] = v; render(); }
function setDrill(v) { state.drill = v; render(); }
function toggleMetric(key, m, def) {
  const cur = state.toggles[key] || def.split('|');
  const next = cur.includes(m) ? cur.filter(x => x !== m) : cur.concat([m]);
  state.toggles[key] = next.length ? next : [m];
  render();
}

function render() {
  build();
  /* nav */
  document.getElementById('nav').innerHTML = TABS.map((t, i) =>
    '<button class="' + (state.tab === t.id ? 'on' : '') + '" onclick="goTab(\'' + t.id + '\')">' +
    '<span class="n">' + (i + 1) + '</span>' + t.n + '</button>').join('');
  /* presets */
  document.getElementById('presets').innerHTML = PRESETS.map(p =>
    '<button class="' + (state.preset === p.id ? 'on' : '') + '" onclick="goPreset(\'' + p.id + '\')">' + p.n + '</button>').join('');
  document.getElementById('dStart').value = state.start;
  document.getElementById('dEnd').value = state.end;
  document.getElementById('rangePill').textContent = rangeLabel(state.start, state.end) + ' · ' + V.rows.length + ' days';
  const bs = document.getElementById('basis');
  bs.className = 'basis' + (V.cmp.kind === 'prev' ? ' neutral' : '');
  bs.innerHTML = '<b>Comparison basis</b><span>' +
    (V.hasCmp ? V.cmp.label + ' — ' + V.cmp.note : (V.cmp.note || V.cmp.label)) + '</span>';
  /* view */
  const t = TABS.find(x => x.id === state.tab);
  document.getElementById('views').innerHTML = '<div class="view on">' + t.r() + '</div>';
  if (t.a) t.a();
}
function goTab(id) { state.tab = id; state.drill = null; render(); window.scrollTo({ top: 0 }); }
function goPreset(id) {
  if (id === 'custom') { state.preset = 'custom'; render(); return; }
  if (applyPreset(id)) render();
}

document.getElementById('dStart').min = MIN_D; document.getElementById('dStart').max = MAX_D;
document.getElementById('dEnd').min = MIN_D; document.getElementById('dEnd').max = MAX_D;
document.getElementById('dStart').addEventListener('change', e => {
  state.start = e.target.value; if (state.start > state.end) state.end = state.start; state.preset = 'custom'; render();
});
document.getElementById('dEnd').addEventListener('change', e => {
  state.end = e.target.value; if (state.end < state.start) state.start = state.end; state.preset = 'custom'; render();
});
const cs = document.getElementById('chanSel');
cs.innerHTML = '<option value="all">All channels</option>' + CHANNELS.map(c => '<option value="' + c.id + '">' + c.name + '</option>').join('');
cs.addEventListener('change', e => { state.channel = e.target.value; state.drill = e.target.value === 'all' ? null : e.target.value; render(); });
document.getElementById('cmpSel').addEventListener('change', e => { state.cmp = e.target.value; render(); });
document.getElementById('brandSub').innerHTML = DATA.sheets.length + ' sheets · ' + rangeLabel(MIN_D, MAX_D) + '<br>' + ALL_DATES.length + ' days of daily data';

applyPreset('mtd');
render();
</script>
